      type: leaf
      label: 3 SWA layers / 1 full GQA; partial RoPE
      color: attn
    - id: stage1
      type: leaf
      label: RMSNorm + residual
      color: norm
    - id: stage2
      type: leaf
      label: 256 routed experts; top 8 per token
      color: moe
    - id: stage3
      type: leaf
      label: Auxiliary MTP modules
      color: out
