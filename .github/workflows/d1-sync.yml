name: Sync D1 Data

on:
  push:
    branches:
      - main
    paths:
      - "data/models.json"
      - "data/providers.json"
      - "data/architectures/**"
      - "src/modelsheet-cli/**"
      - "src/modelsheet-web/functions/**"
      - "src/modelsheet-web/migrations/**"
      - "src/modelsheet-web/wrangler.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/d1-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Generate SQLite and D1 seed SQL
        run: |
          uv run modelsheet db build
          uv run modelsheet db seed
          uv run modelsheet db verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/modelsheet-web/package-lock.json

      - name: Install web dependencies
        working-directory: src/modelsheet-web
        run: npm ci

      - name: Apply D1 migrations
        working-directory: src/modelsheet-web
        run: npx wrangler d1 migrations apply modelsheet --remote

      - name: Seed remote D1
        run: python scripts/sync_d1_seed.py --seed data/d1/seed.sql --wrangler src/modelsheet-web/wrangler.toml

      - name: Verify remote D1
        working-directory: src/modelsheet-web
        run: npx wrangler d1 execute modelsheet --remote --command "SELECT COUNT(*) AS model_count FROM models" --json
