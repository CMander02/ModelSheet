  vocabSize: 120832
  numExperts: 256
  numSharedExperts: 1
  numExpertsPerToken: 8
  numActivatedExperts: 9
  moeIntermediateSize: 2048
  totalParameters: 779960992733
  totalParametersLabel: 780B
  activeParameters: 49000000000
  activeParametersLabel: 49B
sourceLinks:
