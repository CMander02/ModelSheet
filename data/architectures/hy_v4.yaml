id: hy_v4
family: Hy4
era: '2026'
type: decoder
normPlacement: pre
description:
  zh: Hy4 使用 Gated DeepSeek Sparse Attention、IndexCache、iHC 残差与稀疏 MoE，首层为 dense FFN，其余层为 MoE。
  en: Hy4 combines Gated DeepSeek Sparse Attention, IndexCache, iHC residuals, and sparse MoE, with a dense first
    layer followed by MoE layers.
