id: qwen2
family: Qwen2 / Qwen2.5
era: "2024"
type: decoder
normPlacement: pre
description:
  zh: "引入 GQA，移除 LogN/动态 NTK，部分层支持 Sliding Window Attention。SwiGLU FFN，QKV 带 bias。"
  en: "Introduces GQA, removes LogN/NTK tricks, and supports optional sliding-window attention in some layers. SwiGLU FFN with QKV bias."
paperUrl: https://arxiv.org/abs/2407.10671
hfOrg: Qwen/Qwen2.5-7B
aliases:
  - qwen2
  - qwen2_moe
  - qwen2_vl
  - qwen2_5_vl
  - qwen2_5_omni
defaultParams:
  numLayers: 28
  numHeads: 28
  numKvHeads: 4
  hiddenSize: 3584
sourceLinks:
  - label: Raschka gallery
    url: https://sebastianraschka.com/llm-architecture-gallery/
    type: reference
  - label: HuggingFace config
    url: https://huggingface.co/Qwen/Qwen2.5-7B/blob/main/config.json
    type: hf-config
features:
  attention: GQA
  positionEncoding: RoPE
  norm: RMSNorm
  ffn: SwiGLU
  qkvBias: true
variants:
  - id: qwen2-moe
    name: Qwen2 MoE
    aliases: [qwen2_moe]
    descriptionZh: "共享 Qwen2 模块谱系，FFN 替换为 MoE 路由专家。"
    descriptionEn: "Shares the Qwen2 module lineage and replaces dense FFN with routed MoE experts."
  - id: qwen2-vl
    name: Qwen2 VL / Omni
    aliases: [qwen2_vl, qwen2_5_vl, qwen2_5_omni]
    descriptionZh: "多模态变体保留文本解码器主干，视觉或音频模块作为外部编码器接入。"
    descriptionEn: "Multimodal variants keep the text decoder backbone and attach vision or audio encoders."
evidence:
  - source: Raschka gallery
    url: https://sebastianraschka.com/llm-architecture-gallery/
    noteZh: "用于核对 Qwen 系列与现代 GQA/RoPE/SwiGLU 图示风格。"
    noteEn: "Used to align Qwen-family diagrams with the modern GQA/RoPE/SwiGLU presentation."
diagram:
  subtitle: "hidden: {{hiddenSize}} · Q:{{numHeads}} KV:{{numKvHeads}}"
  nodes:
    - id: input
      type: leaf
      label: Input tokens
      color: input
    - id: emb
      type: leaf
      label: Token Embedding
      color: emb
    - id: block
      type: group
      label: Transformer Block
      badge: "x{{numLayers}}"
      color: steel
      sub: "{{numLayers}} identical layers"
      children:
        - id: ln1
          type: leaf
          label: RMSNorm
          sub: pre-norm
          color: norm
        - id: attn
          type: leaf
          label: "GQA Q:{{numHeads}} KV:{{numKvHeads}}"
          sub: RoPE · QKV bias · optional sliding window
          color: attn
        - id: r1
          type: leaf
          label: "+ residual"
          color: resid
        - id: ln2
          type: leaf
          label: RMSNorm
          sub: pre-norm
          color: norm
        - id: ffn
          type: leaf
          label: SwiGLU FFN
          sub: gate · up -> SiLU -> down
          color: ffn
        - id: r2
          type: leaf
          label: "+ residual"
          color: resid
    - id: lnf
      type: leaf
      label: Final RMSNorm
      color: norm
    - id: lmh
      type: leaf
      label: LM Head
      sub: tied to token emb
      color: out
