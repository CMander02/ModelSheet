id: mimo-v26
family: MiMo V2.6
era: '2026'
type: decoder
normPlacement: pre
description:
  zh: 稀疏 MoE 多模态模型，交替使用滑动窗口与全局注意力，并使用多 Token 预测辅助模块。
  en: Sparse multimodal MoE with sliding-window/global attention and auxiliary multi-token
    prediction.
aliases:
- mimo_v2
defaultParams:
  numLayers: 70
  hiddenSize: 6144
sourceLinks:
- label: Official model documentation
  url: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Pro-RL
  type: official
diagram:
  subtitle: MiMo V2.6
  nodes:
  - id: input
    type: leaf
    label: Input embeddings
    color: input
  - id: block
    type: group
    label: Model backbone
    color: steel
    defaultExpanded: true
    children:
    - id: stage0
      type: leaf
      label: SWA / global GQA
      color: attn
    - id: stage1
      type: leaf
      label: Residual + normalization
      color: norm
    - id: stage2
      type: leaf
      label: Top-k routed expert FFNs
      color: moe
    - id: stage3
      type: leaf
      label: Residual; auxiliary MTP during training
      color: resid
  - id: output
    type: leaf
    label: Output head
    color: out
