id: baichuan
family: Baichuan 2
era: "2023"
type: decoder
normPlacement: pre
description:
  zh: "Baichuan 2 使用 RMSNorm、SwiGLU 与无 bias 投影，7B 使用 RoPE，13B 采用 ALiBi。"
  en: "Baichuan 2 uses RMSNorm, SwiGLU, and bias-free projections; 7B uses RoPE while 13B uses ALiBi."
paperUrl: https://arxiv.org/abs/2309.10305
hfOrg: baichuan-inc/Baichuan2-7B-Base
aliases: [baichuan, baichuan_m1]
defaultParams:
  numLayers: 32
  numHeads: 32
  hiddenSize: 4096
features:
  attention: MHA
  positionEncoding: RoPE or ALiBi
  norm: RMSNorm
  ffn: SwiGLU
diagram:
  subtitle: "RoPE/ALiBi variants · heads: {{numHeads}}"
  nodes:
    - id: input
      type: leaf
      label: Input tokens
      color: input
    - id: emb
      type: leaf
      label: Token Embedding
      color: emb
    - id: block
      type: group
      label: Baichuan Block
      badge: "x{{numLayers}}"
      color: steel
      children:
        - id: norm1
          type: leaf
          label: RMSNorm
          color: norm
        - id: attn
          type: leaf
          label: MHA
          sub: RoPE 7B · ALiBi 13B
          color: attn
        - id: ffn
          type: leaf
          label: SwiGLU FFN
          color: ffn
    - id: head
      type: leaf
      label: LM Head
      color: out
