# =============================================================================
# ModelSheet — Model Filter Rules
# =============================================================================
#
# This file controls which models are filtered out during `modelsheet scan`
# and `modelsheet filter test`. Each rule matches against the model name
# (the part after the "/" in "org/model").
#
# Rules are case-insensitive regex patterns.
# Use `modelsheet filter` CLI commands to manage this file.
#
# Pipeline-tag and model-type filters are still hardcoded in filters.py
# (they don't change often). This file covers name-based suffix/pattern rules.
#
# =============================================================================

rules:
  # ── Quantization formats ──
  - pattern: "\\b(AWQ|GPTQ|GGUF|GGML)\\b"
    reason: "quantized (AWQ/GPTQ/GGUF/GGML)"
  - pattern: "\\bQ\\d+_K_[SM]\\b"
    reason: "quantized (Q level)"
  - pattern: "\\bW\\d+A\\d+\\b"
    reason: "weight-only quantized"
  - pattern: "\\bINT[248]\\b"
    reason: "INT quantized"
  - pattern: "\\bFP[48]\\b"
    reason: "FP quantized"
  - pattern: "\\bFP4\\b"
    reason: "FP4 quantized"
  - pattern: "\\bNF4\\b"
    reason: "NF4 quantized"
  - pattern: "\\bBNB\\b"
    reason: "bitsandbytes quantized"
  - pattern: "\\bAQLM\\b"
    reason: "AQLM quantized"
  - pattern: "\\bEXL2\\b"
    reason: "EXL2 quantized"
  - pattern: "\\b(?:4|8)-?bit(?:s)?\\b"
    reason: "X-bit quantized"
  - pattern: "\\bSQ\\b"
    reason: "SmoothQuant quantized"
  - pattern: "NVFP4"
    reason: "NVFP4 quantized variant"
  - pattern: "eagle$"
    reason: "speculative decoding head (EAGLE)"
  - pattern: "_gguf"
    reason: "GGUF quantized variant"

  # ── ASR / TTS / Speech ──
  - pattern: "\\b(whisper|asr|tts|speech|vocoder)\\b"
    reason: "ASR/TTS model"

  # ── Embedding / Rerank / Retrieval ──
  - pattern: "\\b(embed(?:ding)?s?|rerank(?:er)?|retriev(?:al|er))\\b"
    reason: "embedding/rerank model"
  - pattern: "\\b(bge|e5|gte|nomic-embed|sentence-?transformers?)\\b"
    reason: "embedding model"

  # ── Reward / ORM / PRM ──
  - pattern: "\\b[op]rm\\b"
    reason: "reward/ORM/PRM model"
  - pattern: "\\breward-?model\\b"
    reason: "reward model"

  # ── Translation ──
  - pattern: "\\b(nllb|m2m100|mbart|opus-mt)\\b"
    reason: "translation model"

  # ── Diffusion (image gen, not LM) ──
  - pattern: "\\b(stable-?diffusion|sdxl|sd-?v\\d|sd\\d|flux|kandinsky|dall-?e|midjourney|imagen|pixart|cogvideox)\\b"
    reason: "diffusion (image gen, not LM)"

  # ── Classifier / Discriminator ──
  - pattern: "\\b(classifier|discriminator)\\b"
    reason: "classifier/discriminator model"

  # ── Vision-only / CLIP / SigLIP ──
  - pattern: "\\b(siglip|siglip2|tip|clip|owlv2|owlvit|vit|deit|beit|convnext|swin)\\b"
    reason: "vision-only model (CLIP/SigLIP/ViT)"

  # ── Bio / AlphaGenome (not LLM) ──
  - pattern: "\\b(alphagenome|alphafold|esm-?fold|protbert)\\b"
    reason: "bioinformatics model"

  # ── Evaluation / Metric models ──
  - pattern: "\\b(metricx|seahorse|comet-|bleurt|rubric)\\b"
    reason: "evaluation/metric model"

  # ── Retrieval / Search / Rerank ──
  - pattern: "\\b(xtr|colbert|colbertv2|dpr|ance|splade|contriever)\\b"
    reason: "retrieval/search model"

  # ── Interpretability probes ──
  - pattern: "\\bgemma-scope\\b"
    reason: "interpretability probe (not LLM)"

  # ── Music / Audio non-TTS ──
  - pattern: "\\b(magenta|musicgen|audiogen|encodec|soundstream|hilbert)\\b"
    reason: "music/audio generation model"

  # ── Diarization / Speaker ──
  - pattern: "\\b(diarizationlm|diarization|speaker-verification|speaker-diarization)\\b"
    reason: "speaker diarization model"

  # ── Time series ──
  - pattern: "\\btimesfm\\b"
    reason: "time series forecasting model"

  # ── Pose / Keypoint / Tracking ──
  - pattern: "\\b(tapnet|pose|keypoint|tracking)\\b"
    reason: "pose/tracking model"

  # ── Model deployment variants / backends ──
  - pattern: "-(keras|pytorch|flax|tflite|cpp|sfp-cpp|litert-(lm|preview)|litert-lm|litert-preview)$"
    reason: "deployment backend variant"
  - pattern: "-onnx$"
    reason: "ONNX deployment variant"

  # ── Domain-specific Mistral variants ──
  - pattern: "\\b(leanstral|magistral|devstral)\\b"
    reason: "domain-specific Mistral variant"

  # ── Old Gemma generations (pre-gemma-3) ──
  - pattern: "\\bgemma-1\\.1\\b"
    reason: "old Gemma 1.1 generation"
  - pattern: "\\bgemma-2\\b"
    reason: "old Gemma 2 generation"
  - pattern: "\\b(gemma-7b|gemma-2b)\\b"
    reason: "old Gemma 1 generation"

  # ── Old codegemma (pre-1.1) ──
  - pattern: "\\bcodegemma\\b"
    reason: "CodeGemma (not pure Gemma)"

  # ── Old recurrentgemma (pre-9b) ──
  - pattern: "\\brecurrentgemma-2b\\b"
    reason: "old RecurrentGemma (pre-9b)"

  # ── QAT / quantization-aware training variants ──
  - pattern: "-qat-"
    reason: "QAT (quantization-aware training) variant"

  # ── Safety classifiers ──
  - pattern: "\\bshieldgemma\\b"
    reason: "safety classifier (not LLM)"

  # ── Google domain-specific Gemma variants ──
  - pattern: "\\b(txgemma|datagemma|functiongemma|vaultgemma|medgemma|recurrentgemma)\\b"
    reason: "domain-specific Gemma variant (not pure Gemma)"

  # ── UMT5 (multilingual T5 variant) ──
  - pattern: "\\bumt5\\b"
    reason: "multilingual T5 variant (not pure LLM)"

  # ── Translation models (explicit) ──
  - pattern: "\\b(translategemma|madlad400)\\b"
    reason: "translation model"

  # ── Evaluation / misc Google models ──
  - pattern: "\\b(svq|hear)\\b"
    reason: "evaluation/audio model (not LLM)"
  - pattern: "t5_11b_trueteacher"
    reason: "evaluation model (Trueteacher/ANLI)"

  # ── DeepSeek — Janus (multimodal gen, not MLLM) ──
  - pattern: "janus"
    reason: "Janus multimodal generation model"

  # ── DeepSeek — OCR (pure OCR, not MLLM) ──
  - pattern: "\\bdeepseek-ocr\\b"
    reason: "DeepSeek OCR model"

  # ── PaliGemma fine-tune variants (ft-* checkpoints) ──
  - pattern: "\\bpaligemma-3b-ft-"
    reason: "PaliGemma fine-tune checkpoint"
