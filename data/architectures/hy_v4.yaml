diagram:
  subtitle: Gated DSA + IndexCache · MoE top-{{numExpertsPerToken}} · active {{activeParametersLabel}}
  nodes:
  - id: input
    type: leaf
    label: Input tokens
    sub: context {{contextLength}}
    color: input
  - id: emb
