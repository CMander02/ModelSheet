[project]
name = "modelsheet"
version = "0.1.0"
description = "CLI tool for fetching and parsing LLM model configs from HuggingFace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
modelsheet = "modelsheet_cli.cli:app"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modelsheet_cli"]
package-dir = {"modelsheet_cli" = "src/modelsheet-cli"}
