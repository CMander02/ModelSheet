# =============================================================================
# ModelSheet — Model Filter Rules (managed via `modelsheet filter`)
# =============================================================================
# NOTE: In YAML double-quoted strings (e.g. "\\btext\\b"), each \\ is an
# escaped backslash. So "\\b" in YAML = Python "\b" = regex word boundary \b.
# Similarly "\\d" = Python "\d" = regex digit \d.
# Do NOT use raw "\b" (backspace) or 4 backslashes "\\\\b" (literal \b).
# =============================================================================

rules:
  # ── DeepSeek OCR ──
  - pattern: "\\bdeepseek-ocr\\b"
    reason: "DeepSeek OCR model"

  # ── Baidu OCR ──
  - pattern: "\\bqianfan-ocr\\b"
    reason: "Baidu OCR model (not MLLM)"

  # ── Baidu 2-bit quantized ──
  - pattern: "-2bits$"
    reason: "2-bit quantized (Baidu ERNIE)"

  # ── Tensor parallelism variant ──
  - pattern: "-tp\\d+$"
    reason: "tensor parallelism variant"

  # ── Weight+activation quantized ──
  - pattern: "-w\\d+a\\d+c\\d+"
    reason: "weight+activation quantized (e.g. -W4A8C8)"

  # ── PaliGemma fine-tune ──
  - pattern: "\\bpaligemma-3b-ft-"
    reason: "PaliGemma fine-tune checkpoint"

  # ── PaliGemma2 ft-docci ──
  - pattern: "ft-docci"
    reason: "PaliGemma2 ft-docci fine-tune checkpoint"

  # ── Deployment backend variants ──
  - pattern: "-(jax|paddle)$"
    reason: "deployment backend variant (JAX/Paddle)"
