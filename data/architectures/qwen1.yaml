id: qwen1
family: Qwen1
era: "2023"
type: decoder
normPlacement: pre
description:
  zh: "Qwen1 使用 MHA、RMSNorm、SwiGLU、RoPE，并包含 LogN 与动态 NTK 等长上下文技巧，QKV 带 bias。"
  en: "Qwen1 uses MHA, RMSNorm, SwiGLU, RoPE, and long-context tricks such as LogN and dynamic NTK, with QKV bias."
paperUrl: https://arxiv.org/abs/2309.16609
hfOrg: Qwen/Qwen-7B
aliases: [qwen]
defaultParams:
  numLayers: 32
  numHeads: 32
  hiddenSize: 4096
features:
  attention: MHA
  positionEncoding: RoPE with LogN and dynamic NTK
  norm: RMSNorm
  ffn: SwiGLU
diagram:
  subtitle: "MHA · hidden: {{hiddenSize}}"
  nodes:
    - id: input
      type: leaf
      label: Input tokens
      color: input
    - id: emb
      type: leaf
      label: Token Embedding
      color: emb
    - id: block
      type: group
      label: Qwen1 Block
      badge: "x{{numLayers}}"
      color: steel
      children:
        - id: norm1
          type: leaf
          label: RMSNorm
          color: norm
        - id: attn
          type: leaf
          label: "MHA Q:{{numHeads}}"
          sub: RoPE · LogN · dynamic NTK · QKV bias
          color: attn
        - id: r1
          type: leaf
          label: "+ residual"
          color: resid
        - id: norm2
          type: leaf
          label: RMSNorm
          color: norm
        - id: ffn
          type: leaf
          label: SwiGLU FFN
          color: ffn
        - id: r2
          type: leaf
          label: "+ residual"
          color: resid
    - id: head
      type: leaf
      label: LM Head
      color: out
